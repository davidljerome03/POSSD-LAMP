<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <header class="dashboard-header">
        <div class="user-info">
            Welcome, <span id="welcomeName">User</span>!
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
            <button id="logoutBtn" class="btn btn-danger" style="width: auto;">Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="toolbar">
            <input type="text" id="searchInput" class="form-control search-bar" placeholder="Search contacts...">
            <button id="addContactBtn" class="btn" style="width: auto;">+ Add Contact</button>
        </div>
        
        <div id="contactsError" class="hidden" style="color: var(--danger-color); margin-bottom: 1rem; text-align: center;"></div>
        
        <div class="contacts-grid" id="contactsGrid">
            <!-- Contacts will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Add/Edit Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Contact</h2>
                <span class="close-btn">&times;</span>
            </div>
            <div id="modalError" class="hidden" style="color: var(--danger-color); margin-bottom: 1rem; text-align: center; font-weight: 700;"></div>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="contactFirstName">First Name</label>
                    <input type="text" id="contactFirstName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="contactLastName">Last Name</label>
                    <input type="text" id="contactLastName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="contactPhone">Phone</label>
                    <input type="tel" id="contactPhone" class="form-control">
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email</label>
                    <input type="email" id="contactEmail" class="form-control">
                </div>
                <button type="submit" class="btn">Save Contact</button>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <h2 style="margin-bottom: 1rem;">Delete Contact?</h2>
            <p style="margin-bottom: 1.5rem; font-weight: 600;">Are you sure you want to delete this contact? This cannot be undone.</p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button id="cancelDeleteBtn" class="btn" style="background: var(--card-bg); color: var(--text-main);">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/mockApi.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
