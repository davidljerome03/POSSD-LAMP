<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <div style="position: absolute; top: 1.5rem; right: 1.5rem;">
        <button id="themeToggleBtn" class="theme-toggle" aria-label="Toggle Dark Mode">🌙</button>
    </div>
    <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-card" id="loginCard">
            <h2>Sign In</h2>
            <div id="loginError" class="hidden" style="color: var(--danger-color); text-align: center; margin-bottom: 1rem; font-weight: 700;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="toggle-link">
                Don't have an account? <br><a id="showRegisterBtn">Register here</a>
            </div>
        </div>

        <!-- Register Form -->
        <div class="auth-card hidden" id="registerCard">
            <h2>Create Account</h2>
            <div id="registerError" class="hidden" style="color: var(--danger-color); text-align: center; margin-bottom: 1rem; font-weight: 700;"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regFirstName">First Name</label>
                    <input type="text" id="regFirstName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="regLastName">Last Name</label>
                    <input type="text" id="regLastName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn">Register</button>
            </form>
            <div class="toggle-link">
                Already have an account? <br><a id="showLoginBtn">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
